<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Pedidos</title>
<style>
:root{color-scheme:dark;--bg:#080b13;--panel:#111827;--line:#263248;--text:#e7edf8;--muted:#91a0bb;--blue:#2563eb;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}header{padding:18px;border-bottom:1px solid var(--line);background:#0c111d}h1{font-size:21px;margin:0}header p{color:var(--muted);font-size:12px;margin:5px 0 0}.wrap{max-width:760px;margin:auto;padding:16px 12px 60px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.hidden{display:none!important}.tabs,.stats,.grid,.actions{display:grid;gap:8px}.tabs{grid-template-columns:1fr 1fr;margin-bottom:16px}.stats{grid-template-columns:repeat(3,1fr);margin-bottom:15px}.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));margin-top:12px}button{border:0;border-radius:9px;padding:12px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.tab{background:#1a2436;color:#aebbd2}.tab.active{background:#244a9a;color:white}.secondary{background:#28364e}.green{background:var(--green)}.red{background:#642c36}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#0a101c;color:var(--text);font:inherit}textarea{min-height:95px}.stat{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:22px}.order{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.order h3{margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.status{float:right;color:#facc75;font-size:12px}.done{color:#86efac}.msg{color:#fca5a5;font-size:13px;margin-top:10px}.title{font-size:12px;color:#aebbd2;letter-spacing:1px;margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:7px}.empty{text-align:center;color:var(--muted);padding:25px}.notice{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Controle de Pedidos</h1><p>Cadastro e acompanhamento de solicitações</p></header><main class="wrap">
<section id="login" class="panel hidden"><h2>Entrar</h2><form id="loginForm"><label for="emailLogin">E-mail</label><input id="emailLogin" type="email" autocomplete="username" required><label for="passwordLogin">Senha</label><input id="passwordLogin" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Entrar</button></div><div id="loginMsg" class="msg"></div></form></section>
<div id="app" class="hidden"><div class="actions" style="margin:0 0 12px"><button id="logout" class="secondary">Sair</button></div><nav class="tabs"><button class="tab active" data-tab="entrada">＋ Entrada</button><button class="tab" data-tab="monitoramento">▤ Monitoramento</button></nav>
<section id="entrada" class="panel"><div class="title">Dados do cliente</div><form id="orderForm"><input id="editId" type="hidden"><label for="cliente">Nome do cliente *</label><input id="cliente" required maxlength="120"><label for="cnpj">CNPJ</label><input id="cnpj" maxlength="30" placeholder="00.000.000/0000-00"><div class="grid"><div><label for="telefone">Telefone / WhatsApp</label><input id="telefone" maxlength="30"></div><div><label for="email">E-mail</label><input id="email" type="email" maxlength="120"></div></div><label for="empresa">Empresa / setor</label><input id="empresa" maxlength="120"><div class="title">Detalhes do pedido</div><label for="titulo">Título do pedido *</label><input id="titulo" required maxlength="150"><label for="descricao">Descrição do que o cliente deseja *</label><textarea id="descricao" required maxlength="4000"></textarea><div class="grid"><div><label for="prazo">Prazo</label><input id="prazo" type="date"></div><div><label for="responsavel">Responsável</label><input id="responsavel" maxlength="120"></div></div><label for="prioridade">Prioridade</label><select id="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select><div class="actions"><button id="saveBtn" type="submit">Salvar pedido</button><button type="button" id="cancelEdit" class="secondary hidden">Cancelar edição</button><button type="reset" class="secondary">Limpar</button></div></form></section>
<section id="monitoramento" class="hidden"><div class="stats"><div class="stat"><span>Total</span><strong id="total">0</strong></div><div class="stat"><span>Pendentes</span><strong id="pending">0</strong></div><div class="stat"><span>Concluídos</span><strong id="completed">0</strong></div></div><div class="panel"><label for="search">Buscar pedido ou cliente</label><input id="search" placeholder="Digite para buscar"><div class="tabs" style="margin-top:10px"><button class="secondary" data-filter="todos">Todos</button><button class="secondary" data-filter="pendentes">Pendentes</button><button class="secondary" data-filter="concluidos">Concluídos</button></div></div><div id="orders"></div></section><p class="notice">Pedidos compartilhados pelo banco de dados Supabase.</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// COLE SUA API URL E SUA PUBLISHABLE KEY NAS DUAS LINHAS ABAIXO
const SUPABASE_URL = "https://cknxohaeehlamutakpsp.supabase.co";
const SUPABASE_KEY = "sb_publishable_5rd9UdS5_O0EV4ex0NNwSQ_7BHCmp6q";
const $=id=>document.getElementById(id);let db,orders=[],filter='todos';
function err(msg){$('loginMsg').textContent=msg}
function tab(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('entrada').classList.toggle('hidden',name!=='entrada');$('monitoramento').classList.toggle('hidden',name!=='monitoramento');if(name==='monitoramento')loadOrders()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function val(id){return $(id).value.trim()}function resetForm(){$('orderForm').reset();$('editId').value='';$('saveBtn').textContent='Salvar pedido';$('cancelEdit').classList.add('hidden')}
async function session(){const {data,error}=await db.auth.getSession();if(error){err(error.message);return}const ok=!!data.session;$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok)loadOrders()}
$('loginForm').onsubmit=async e=>{e.preventDefault();err('');const {error}=await db.auth.signInWithPassword({email:val('emailLogin'),password:$('passwordLogin').value});if(error){err('Falha no login. Confira e-mail e senha e se o usuário foi criado no Supabase.');return}await session()};$('logout').onclick=async()=>{await db.auth.signOut();session()};
async function loadOrders(){const {data,error}=await db.from('pedidos').select('*').order('criado_em',{ascending:false});if(error){$('orders').innerHTML='<div class="panel">Erro ao carregar pedidos. Verifique as permissões do Supabase.</div>';return}orders=data||[];render()}
$('orderForm').onsubmit=async e=>{e.preventDefault();const id=val('editId');const r={cliente:val('cliente'),cnpj:val('cnpj')||null,telefone:val('telefone')||null,email:val('email')||null,empresa:val('empresa')||null,titulo:val('titulo'),descricao:val('descricao'),prazo:val('prazo')||null,responsavel:val('responsavel')||null,prioridade:val('prioridade')};const result=id?await db.from('pedidos').update(r).eq('id',id):await db.from('pedidos').insert(r);if(result.error){alert('Erro ao salvar. Confira as permissões do Supabase.');return}resetForm();await loadOrders();tab('monitoramento')};$('cancelEdit').onclick=resetForm;$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function d(s){if(!s)return 'Não informado';return s.split('-').reverse().join('/')}
function render(){const pend=orders.filter(o=>!o.concluido).length;$('total').textContent=orders.length;$('pending').textContent=pend;$('completed').textContent=orders.length-pend;const q=val('search').toLowerCase();const list=orders.filter(o=>(filter==='todos'||(filter==='pendentes'&&!o.concluido)||(filter==='concluidos'&&o.concluido))&&[o.cliente,o.cnpj,o.titulo,o.descricao,o.empresa,o.responsavel].some(v=>(v||'').toLowerCase().includes(q)));if(!list.length){$('orders').innerHTML='<div class="empty">Nenhum pedido encontrado.</div>';return}$('orders').innerHTML=list.map(o=>`<article class="order"><span class="status ${o.concluido?'done':''}">${o.concluido?'Concluído':'Pendente'}</span><h3>${esc(o.titulo)}</h3><div class="muted">${esc(o.cliente)} · ${new Date(o.criado_em).toLocaleDateString('pt-BR')}</div><p>${esc(o.descricao)}</p><div class="muted">${o.cnpj?'CNPJ: '+esc(o.cnpj)+' · ':''}${o.telefone?'Telefone: '+esc(o.telefone)+' · ':''}${o.email?esc(o.email)+' · ':''}${o.empresa?esc(o.empresa)+' · ':''}Prioridade: ${esc(o.prioridade)}${o.prazo?' · Prazo: '+d(o.prazo):''}${o.responsavel?' · Responsável: '+esc(o.responsavel):''}</div><div class="actions"><button class="green" data-act="toggle" data-id="${o.id}">${o.concluido?'Reabrir':'Marcar concluído'}</button><button class="secondary" data-act="edit" data-id="${o.id}">Editar</button><button class="red" data-act="delete" data-id="${o.id}">Excluir</button></div></article>`).join('');$('orders').querySelectorAll('button').forEach(b=>b.onclick=()=>action(b.dataset.act,b.dataset.id))}
async function action(a,id){const o=orders.find(x=>x.id===id);if(!o)return;if(a==='toggle'){const {error}=await db.from('pedidos').update({concluido:!o.concluido}).eq('id',id);if(error)alert('Erro ao atualizar');else loadOrders()}if(a==='delete'&&confirm('Excluir este pedido?')){const {error}=await db.from('pedidos').delete().eq('id',id);if(error)alert('Erro ao excluir');else loadOrders()}if(a==='edit'){tab('entrada');$('editId').value=o.id;['cliente','cnpj','telefone','email','empresa','titulo','descricao','prazo','responsavel'].forEach(k=>$(k).value=o[k]||'');$('prioridade').value=o.prioridade||'Normal';$('saveBtn').textContent='Salvar alterações';$('cancelEdit').classList.remove('hidden');scrollTo(0,0)}}
async function init(){if(SUPABASE_URL.startsWith('COLE_AQUI')||SUPABASE_KEY.startsWith('COLE_AQUI')){document.body.insertAdjacentHTML('afterbegin','<div style="background:#7f1d1d;padding:12px;text-align:center">Configure a URL e a chave pública do Supabase no início do código.</div>');$('login').classList.remove('hidden');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await session();db.auth.onAuthStateChange(()=>setTimeout(session,0))}init();
</script></body></html>
